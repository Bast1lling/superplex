<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slot Generalization Viewer</title>
<style>
  :root { --bg: #f6f6f4; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6b66; --line: #ddddd8; --accent: #2f6fd6; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #161615; --panel: #1f1f1d; --ink: #ebebe6; --muted: #9a9a94; --line: #34342f; --accent: #6d9ff0; } }
  :root[data-theme="dark"] { --bg: #161615; --panel: #1f1f1d; --ink: #ebebe6; --muted: #9a9a94; --line: #34342f; --accent: #6d9ff0; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 13px/1.4 system-ui, sans-serif; display: grid;
         grid-template-columns: 380px 1fr; height: 100vh; overflow: hidden; }
  #side { border-right: 1px solid var(--line); overflow: auto; padding: 10px; background: var(--panel); }
  h1 { font-size: 15px; margin: 0 0 8px; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 14px 0 6px; }
  .item { padding: 3px 6px; border-radius: 4px; cursor: pointer; display: flex; justify-content: space-between; gap: 6px; }
  .item:hover { background: var(--line); }
  .item.sel { background: var(--accent); color: white; }
  .item small { opacity: .75; font-variant-numeric: tabular-nums; }
  #main { display: grid; grid-template-rows: 1fr auto auto auto; min-width: 0; min-height: 0; }
  #split { height: 7px; cursor: row-resize; background: var(--line); border-top: 1px solid var(--line); position: relative; }
  #split::after { content: ""; position: absolute; left: 50%; top: 2px; width: 40px; height: 3px; margin-left: -20px; border-radius: 2px; background: var(--muted); opacity: .6; }
  #view { position: relative; min-height: 0; }
  #view canvas { display: block; }
  .bar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 6px 10px; border-top: 1px solid var(--line); background: var(--panel); }
  #imgs { display: flex; gap: 8px; overflow-x: auto; padding: 6px 10px; border-top: 1px solid var(--line); background: var(--panel); }
  #imgs figure { margin: 0; text-align: center; color: var(--muted); font-size: 11px; }
  #imgs img, #imgs canvas { height: var(--imgh, 200px); image-rendering: pixelated; border-radius: 3px; display: block; }
  details.grp > summary { cursor: pointer; padding: 3px 2px; font-weight: 600; color: var(--muted); list-style: none; display: flex; justify-content: space-between; }
  details.grp > summary::-webkit-details-marker { display: none; }
  details.grp > summary::before { content: "▸ "; }
  details.grp[open] > summary::before { content: "▾ "; }
  details.grp > .item { margin-left: 10px; }
  #info { position: absolute; top: 8px; left: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 4px;
          padding: 6px 8px; max-width: 420px; white-space: pre; font: 11px/1.35 ui-monospace, monospace; opacity: .92; }
  #legend { position: absolute; bottom: 8px; left: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 4px;
            padding: 4px 8px; font-size: 11px; color: var(--muted); opacity: .92; }
  #metrics { font: 11px ui-monospace, monospace; white-space: pre-wrap; color: var(--muted); }
  table { border-collapse: collapse; width: 100%; font: 11px ui-monospace, monospace; }
  th { position: sticky; top: 0; background: var(--panel); cursor: pointer; text-align: right; padding: 2px 3px; border-bottom: 1px solid var(--line); }
  td { text-align: right; padding: 1px 3px; }
  tr.sel td { background: var(--accent); color: white; }
  tbody tr { cursor: pointer; }
  tbody tr:hover td { background: var(--line); }
  .sw { display: inline-block; width: 9px; height: 9px; border-radius: 2px; }
  #tablewrap { max-height: 45vh; overflow: auto; border: 1px solid var(--line); border-radius: 4px; }
  label { display: inline-flex; gap: 4px; align-items: center; white-space: nowrap; }
  select { font: inherit; }
  .strip { display: flex; flex-wrap: wrap; gap: 1px; margin: 2px 0 6px; }
  .strip i { width: 7px; height: 14px; cursor: pointer; border-radius: 1px; position: relative; }
  .strip i.saved::after { content: ""; position: absolute; left: 2px; top: -3px; width: 3px; height: 3px; border-radius: 50%; background: var(--ink); }
  .strip i.cur { outline: 2px solid var(--ink); outline-offset: 0; z-index: 1; }
  .legend-row { display: flex; gap: 10px; flex-wrap: wrap; font-size: 11px; color: var(--muted); }
  #curves svg { width: 100%; height: 150px; display: block; }
  #curves text { fill: var(--muted); font: 10px ui-monospace, monospace; }
  .nav { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  button { font: inherit; padding: 1px 8px; }
  @media (max-width: 800px) { body { grid-template-columns: 1fr; grid-template-rows: 45vh 55vh; overflow: auto; } }
</style>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
               "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
</script>
</head>
<body>
<div id="side">
  <h1>28 — Slot generalization viewer</h1>
  <h2>Runs</h2><div id="runs"></div>
  <h2>Curves <select id="cmetric"><option>pair_iou_fr</option><option>mask_miou</option><option>part_iou_fr</option><option>ari</option><option>sdf_own</option><option>parts_active</option><option>unmatched_active</option></select></h2>
  <div id="curves"></div>
  <h2>Frames</h2>
  <div class="legend-row" id="splitlegend"></div>
  <div id="strips"></div>
  <div class="nav"><button id="prev">◀</button><button id="next">▶</button><span id="curframe"></span>
    <label>checkpoint <select id="ckpt"></select></label></div>
  <h2>This frame</h2><div id="metrics"></div>
  <h2>Targets <small id="tcount"></small></h2>
  <div id="tablewrap"><table id="ttable"></table></div>
</div>
<div id="main">
  <div id="view"><div id="info">loading…</div><div id="legend"></div></div>
  <div class="bar">
    <label>points <select id="pcol">
      <option value="rgb">RGB</option><option value="label">GT label (target)</option><option value="fit">target fit |SDF|</option>
      <option value="slot">predicted slot</option><option value="perr">pred |SDF| (own slot)</option><option value="none">hidden</option></select></label>
    <label><input type="checkbox" id="showT" checked> targets</label>
    <label><input type="checkbox" id="showDrop"> dropped SQs</label>
    <label><input type="checkbox" id="showP" checked> matched slots</label>
    <label><input type="checkbox" id="showU"> unmatched slots</label>
    <label>exist &gt; <input type="range" id="thr" min="0" max="1" step="0.05" value="0.5" style="width:70px"> <span id="thrv">0.5</span></label>
    <label><input type="checkbox" id="showA"> anchors</label>
    <label><input type="checkbox" id="showS"> target samples (weight)</label>
    <label><input type="checkbox" id="showF"> free samples</label>
    <label><input type="checkbox" id="solo"> selected only</label>
  </div>
  <div id="split" title="drag to resize the images"></div>
  <div id="imgs"></div>
</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const $ = id => document.getElementById(id);
const view = $('view');
const renderer = new THREE.WebGLRenderer({ antialias: true });
view.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, 1, 0.01, 100);
camera.up.set(0, -1, 0); camera.position.set(0, 0, -0.3);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0, 2.5);
scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const dl = new THREE.DirectionalLight(0xffffff, 0.8); dl.position.set(1, -2, -1); scene.add(dl);
const G = { pts: new THREE.Group(), t: new THREE.Group(), d: new THREE.Group(), p: new THREE.Group(), u: new THREE.Group(),
            a: new THREE.Group(), s: new THREE.Group(), f: new THREE.Group() };
Object.values(G).forEach(g => scene.add(g));
function resize() { const r = view.getBoundingClientRect(); renderer.setSize(r.width, r.height); camera.aspect = r.width / r.height; camera.updateProjectionMatrix(); }
new ResizeObserver(resize).observe(view);
const bg = () => getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
(function loop() { renderer.setClearColor(bg()); controls.update(); renderer.render(scene, camera); requestAnimationFrame(loop); })();

const spow = (x, p) => Math.sign(x) * Math.pow(Math.abs(x), p);
function sqGeometry(s, n = 16) {
  const pos = [], idx = [];
  for (let i = 0; i <= n; i++) {
    const eta = -Math.PI / 2 + Math.PI * i / n;
    for (let j = 0; j <= 2 * n; j++) {
      const om = -Math.PI + Math.PI * j / n, ce = spow(Math.cos(eta), s.shape[0]);
      const l = [s.scale[0] * ce * spow(Math.cos(om), s.shape[1]), s.scale[1] * ce * spow(Math.sin(om), s.shape[1]), s.scale[2] * spow(Math.sin(eta), s.shape[0])];
      const R = s.rot;
      pos.push(R[0] * l[0] + R[1] * l[1] + R[2] * l[2] + s.trans[0], R[3] * l[0] + R[4] * l[1] + R[5] * l[2] + s.trans[1], R[6] * l[0] + R[7] * l[1] + R[8] * l[2] + s.trans[2]);
    }
  }
  const m = 2 * n + 1;
  for (let i = 0; i < n; i++) for (let j = 0; j < 2 * n; j++) { const a = i * m + j; idx.push(a, a + m, a + 1, a + 1, a + m, a + m + 1); }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setIndex(idx); g.computeVertexNormals();
  return g;
}
// same palette as server.py's hue(): HLS (h, 0.55, 0.65)
const hue = i => new THREE.Color().setHSL((i * 0.618034) % 1, 0.65, 0.55);
const gray = new THREE.Color(0x777777), dark = new THREE.Color(0x262626);
function heatColor(x, vmax) {
  if (x < 0) return dark;
  const t = Math.min(Math.max(x / vmax, 0), 1), lo = [0.05, 0.05, 0.3], mid = [0.85, 0.2, 0.35], hi = [1, 0.95, 0.3];
  const c = t < 0.5 ? lo.map((v, i) => v + (mid[i] - v) * t * 2) : mid.map((v, i) => v + (hi[i] - v) * (t - 0.5) * 2);
  return new THREE.Color(c[0], c[1], c[2]);
}

let runs = [], run = null, ckpt = 'final', frames = [], frame = null, data = null, selT = -1, sortKey = 'id', sortDir = 1;
const SPLIT = { train: ['#2f9e44', 'trained on'], block: ['#a9d8b3', 'training block, unused'], gap: ['#bbbbb5', 'gap'],
                views: ['#e8590c', 'held-out views'], scene: ['#7048e8', 'held-out scene'] };
const CURVE = { train: '#2f9e44', views: '#e8590c', scenes: '#7048e8' };

function clear(g) { while (g.children.length) { const c = g.children.pop(); c.geometry?.dispose(); } }
function pointCloud(xyz, colors, size) {
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(xyz, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
  return new THREE.Points(g, new THREE.PointsMaterial({ size, vertexColors: true }));
}

function draw() {
  Object.values(G).forEach(clear);
  if (!data) return;
  const solo = $('solo').checked && selT >= 0, thr = +$('thr').value, P = data.points, mode = $('pcol').value;
  const legend = { rgb: 'points: RGB', label: 'points: GT label = target color (dark = ignore)', fit: 'points: |SDF| to own target, 0 .. 10 cm',
                   slot: 'points: argmax slot, colored as its matched target (gray = unmatched slot)', perr: 'points: |SDF| to own target\'s slot SQ, 0 .. 10 cm', none: '' }[mode];
  $('legend').textContent = legend + ($('showS').checked ? ' | samples: weight 0 (dark) .. 1 (yellow)' : '');
  if (mode !== 'none') {
    const xyz = [], col = [];
    for (let i = 0; i < P.label.length; i++) {
      if (solo && P.label[i] !== selT) continue;
      let c;
      if (mode === 'rgb') c = new THREE.Color(P.rgb[3 * i] / 255, P.rgb[3 * i + 1] / 255, P.rgb[3 * i + 2] / 255);
      else if (mode === 'label') c = P.label[i] >= 0 ? hue(P.label[i]) : dark;
      else if (mode === 'fit') c = heatColor(P.fit[i], 0.1);
      else if (mode === 'slot') c = !P.slot ? dark : (P.slot[i] >= 0 ? hue(P.slot[i]) : gray);
      else c = !P.perr ? dark : heatColor(P.perr[i], 0.1);
      xyz.push(P.xyz[3 * i], P.xyz[3 * i + 1], P.xyz[3 * i + 2]); col.push(c.r, c.g, c.b);
    }
    G.pts.add(pointCloud(xyz, col, 0.012));
  }
  data.target_sqs.forEach(t => {
    const i = t.t;
    if (solo && i !== selT) return;
    const mesh = new THREE.Mesh(sqGeometry(t), new THREE.MeshBasicMaterial({ color: hue(i), wireframe: true, transparent: true, opacity: i === selT ? 0.95 : 0.45 }));
    mesh.userData = { kind: 'target', i }; G.t.add(mesh);
  });
  data.dropped.forEach(t => {
    const mesh = new THREE.Mesh(sqGeometry(t, 10), new THREE.MeshBasicMaterial({ color: 0x999999, wireframe: true, transparent: true, opacity: 0.3 }));
    mesh.userData = { kind: 'dropped', s: t }; G.d.add(mesh);
  });
  (data.parts || data.pred || []).forEach((p, k) => {
    if (solo && p.t !== selT) return;
    const matched = p.t >= 0;
    if (!matched && p.exist <= thr) return;
    const mat = new THREE.MeshLambertMaterial({ color: matched ? hue(p.t) : gray, transparent: true, opacity: 0.25 + 0.5 * p.exist, side: THREE.DoubleSide });
    const mesh = new THREE.Mesh(sqGeometry(p), mat);
    mesh.userData = { kind: 'slot', k: p.slot ?? k, s: p };
    (matched ? G.p : G.u).add(mesh);
    if (p.anchor && !data.parts) {
      const g = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(...p.anchor), new THREE.Vector3(...p.trans)]);
      G.a.add(new THREE.Line(g, new THREE.LineBasicMaterial({ color: matched ? hue(p.t) : gray })));
      const sph = new THREE.Mesh(new THREE.SphereGeometry(0.015, 8, 6), new THREE.MeshBasicMaterial({ color: matched ? hue(p.t) : gray }));
      sph.position.set(...p.anchor); G.a.add(sph);
    }
  });
  if ($('showS').checked) {
    const S = data.samples, xyz = [], col = [];
    for (let i = 0; i < S.w.length; i++) {
      if (solo && S.t[i] !== selT) continue;
      const c = heatColor(S.w[i], 1.0);
      xyz.push(S.xyz[3 * i], S.xyz[3 * i + 1], S.xyz[3 * i + 2]); col.push(c.r, c.g, c.b);
    }
    G.s.add(pointCloud(xyz, col, 0.02));
  }
  if ($('showF').checked) G.f.add(pointCloud(data.free, data.free.map((_, i) => [1, 0.2, 0.2][i % 3]), 0.012));
  G.t.visible = $('showT').checked; G.d.visible = $('showDrop').checked; G.p.visible = $('showP').checked;
  G.u.visible = $('showU').checked; G.a.visible = $('showA').checked;
}
['pcol', 'showT', 'showDrop', 'showP', 'showU', 'thr', 'showA', 'showS', 'showF', 'solo'].forEach(id => $(id).addEventListener('input', () => { $('thrv').textContent = $('thr').value; draw(); }));

const fmt = (v, d = 3) => v === undefined || v === null ? '' : (typeof v === 'number' ? (Number.isInteger(v) ? v : v.toFixed(d)) : v);
function table() {
  const cols = [['id', 'id'], ['px', 'px'], ['n_sq', 'SQs'], ['n_parts', 'parts'], ['fit_med', 'fit'], ['slot', 'slot'], ['patches', 'patch'], ['exist', 'exist'],
                ['mask_iou', 'mIoU'], ['pair_iou_fr', 'pIoU fr'], ['pair_iou', 'pIoU all'], ['pair_cd', 'cd'], ['pred_med', 'pred']];
  const rows = [...data.targets].sort((a, b) => ((a[sortKey] ?? -1) - (b[sortKey] ?? -1)) * sortDir);
  const t = $('ttable');
  t.innerHTML = '<thead><tr><th></th>' + cols.map(([k, n]) => `<th data-k="${k}" title="${k}">${n}${sortKey === k ? (sortDir > 0 ? '↑' : '↓') : ''}</th>`).join('') + '</tr></thead><tbody>'
    + rows.map(r => `<tr data-i="${r.id}" class="${r.id === selT ? 'sel' : ''}"><td><span class="sw" style="background:#${hue(r.id).getHexString()}"></span></td>`
      + cols.map(([k]) => `<td>${fmt(r[k], k === 'exist' || k.includes('iou') ? 2 : 3)}</td>`).join('') + '</tr>').join('') + '</tbody>';
  t.querySelectorAll('th[data-k]').forEach(th => th.onclick = () => { const k = th.dataset.k; sortDir = sortKey === k ? -sortDir : 1; sortKey = k; table(); });
  t.querySelectorAll('tbody tr').forEach(tr => tr.onclick = () => select(+tr.dataset.i));
  $('tcount').textContent = `${data.M} kept of ${data.n_all} in the frustum` + (data.pred ? `, ${data.pred.length} slots` : '');
}

function heatCanvas(vals, gh, gw, color) {
  const c = document.createElement('canvas'); c.width = gw; c.height = gh;
  const ctx = c.getContext('2d'), im = ctx.createImageData(gw, gh);
  for (let i = 0; i < vals.length; i++) {
    const v = Math.min(Math.max(vals[i], 0), 1);
    im.data[4 * i] = 20 + (color.r * 255 - 20) * v; im.data[4 * i + 1] = 20 + (color.g * 255 - 20) * v; im.data[4 * i + 2] = 20 + (color.b * 255 - 20) * v; im.data[4 * i + 3] = 255;
  }
  ctx.putImageData(im, 0, 0); return c;
}
async function masks(t = selT, slot = -1) {
  const box = $('maskbox'); if (!box) return;
  box.innerHTML = '';
  if (t < 0 && slot < 0) return;
  const q = new URLSearchParams({ run: run.name, frame, ckpt, t, slot });
  const m = await (await fetch('/api/mask?' + q)).json();
  const col = t >= 0 ? hue(t) : gray;
  if (m.gt) { const f = document.createElement('figure'); f.appendChild(heatCanvas(m.gt, m.gh, m.gw, col)); f.append(`GT share, target ${t}`); box.appendChild(f); }
  if (m.attn) { const f = document.createElement('figure'); f.appendChild(heatCanvas(m.attn, m.gh, m.gw, col)); f.append(`attention, slot ${m.slot}`); box.appendChild(f); }
}

function select(i) {
  selT = selT === i ? -1 : i;
  table(); draw(); masks();
  if (selT >= 0) {
    const t = data.targets[selT], f = a => a.map(x => x.toFixed(3)).join(' ');
    $('info').textContent = `target ${selT}  instance ${t.instance}  ${t.n_sq} SQ(s)  ${t.px} px  fit median ${fmt(t.fit_med)} m`
      + (t.slot >= 0 && data.pred ? (() => { const p = data.pred[t.slot]; return `\nslot ${t.slot}  exist ${p.exist.toFixed(2)}  ${p.patches} patches`
        + (data.parts ? `  ${t.n_parts} active parts for ${t.n_sq} target SQs` : `\nscale ${f(p.scale)}\nshape ${f(p.shape)}\ntrans ${f(p.trans)}`)
        + `\nmask IoU ${fmt(t.mask_iou, 2)}  pair IoU frustum ${fmt(t.pair_iou_fr, 2)} / all ${fmt(t.pair_iou, 2)}  cd ${fmt(t.pair_cd)}  pred |SDF| ${fmt(t.pred_med)}`; })() : '');
  }
}

const ray = new THREE.Raycaster();
renderer.domElement.addEventListener('dblclick', e => {
  const r = renderer.domElement.getBoundingClientRect();
  ray.setFromCamera(new THREE.Vector2((e.clientX - r.left) / r.width * 2 - 1, -(e.clientY - r.top) / r.height * 2 + 1), camera);
  const objs = [G.p, G.u, G.t, G.d].filter(g => g.visible).flatMap(g => g.children);
  const hit = ray.intersectObjects(objs)[0];
  if (!hit) return;
  const u = hit.object.userData;
  if (u.kind === 'target') select(u.i);
  else if (u.kind === 'slot') {
    if (u.s.t >= 0) select(u.s.t);
    else { const f = a => a.map(x => x.toFixed(3)).join(' ');
      $('info').textContent = `unmatched slot ${u.k}  exist ${u.s.exist.toFixed(2)}  ${u.s.patches} patches\nscale ${f(u.s.scale)}\nshape ${f(u.s.shape)}\ntrans ${f(u.s.trans)}`; masks(-1, u.k); }
  } else { const f = a => a.map(x => x.toFixed(3)).join(' '); $('info').textContent = `dropped SQ ${u.s.id} (< 0.5 patch of labels)\nscale ${f(u.s.scale)}\ntrans ${f(u.s.trans)}`; }
});

async function load() {
  $('info').textContent = 'loading…';
  if (!frame) { $('info').textContent = 'pick a frame'; return; }
  const q = new URLSearchParams({ run: run.name, frame, ckpt });
  const r = await fetch('/api/frame?' + q);
  if (q.toString() !== new URLSearchParams({ run: run.name, frame, ckpt }).toString()) return;  // superseded
  if (!r.ok) { data = null; draw(); $('imgs').innerHTML = ''; $('info').textContent = (await r.json()).detail; return; }
  data = await r.json();
  const names = { rgb: 'RGB', labels: 'GT labels (targets)', target_render: 'rendered target SQs', superflex_render: 'rendered SuperFlex SQs (one color per SQ)', superflex_inst: 'rendered SuperFlex SQs (instance color)', pred_render: 'rendered predicted SQs (gray: unmatched)', pred_masks: 'predicted masks (gray: unmatched, black: none)',
                  target_fit: 'target fit |SDF| 0..10 cm', pred_fit: 'pred |SDF| 0..10 cm' };
  const order = ['rgb', 'labels', 'pred_masks', 'superflex_render', 'superflex_inst', 'target_render', 'pred_render', 'target_fit', 'pred_fit'];
  data.images = Object.fromEntries(order.filter(k => k in data.images).map(k => [k, data.images[k]]).concat(Object.entries(data.images).filter(([k]) => !order.includes(k))));
  $('imgs').innerHTML = Object.entries(data.images).map(([k, b]) => `<figure><img src="data:image/png;base64,${b}">${names[k] ?? k}</figure>`).join('')
    + '<div id="maskbox" style="display:flex;gap:8px"></div>';
  if (selT >= data.M) selT = -1;
  $('info').textContent = `${run.name}  ${ckpt === 'final' || ckpt === 'best' ? ckpt + ' checkpoint' : 'step ' + ckpt}  ${frame}  [${SPLIT[data.split]?.[1] ?? data.split}]\ndouble-click an SQ or click a table row`;
  const fm = data.frame_metrics || {};
  $('metrics').textContent = ['mask_miou', 'ari', 'pair_iou_fr', 'pair_iou_full', 'part_iou_fr', 'parts_active', 'part_targets', 'sdf_own', 'sdf_any',
    'targets', 'n_active', 'matched_active', 'unmatched_active', 'used_slots'].filter(k => k in fm).map(k => `${k.padEnd(18)} ${fmt(fm[k])}`).join('\n');
  table(); draw(); masks();
}

function ckptBox() {
  const f = frames.find(x => x.frame === frame);
  const opts = [...run.ckpts, ...(f ? f.steps.map(String) : [])];
  if (!opts.includes(ckpt)) ckpt = opts.includes('final') ? 'final' : (opts.includes('best') ? 'best' : opts[opts.length - 1]);
  $('ckpt').innerHTML = opts.map(o => `<option value="${o}" ${o === ckpt ? 'selected' : ''}>${o === 'final' || o === 'best' ? o + ' (model on any frame)' : 'step ' + o}</option>`).join('')
    || '<option>no checkpoint yet</option>';
}
$('ckpt').onchange = e => { ckpt = e.target.value; load(); };

function strips() {
  const box = $('strips'); box.innerHTML = '';
  const byScene = new Map();
  frames.forEach(f => { const s = f.frame.split('/')[0]; if (!byScene.has(s)) byScene.set(s, []); byScene.get(s).push(f); });
  byScene.forEach((fs, s) => {
    const h = document.createElement('div'); h.className = 'legend-row'; h.textContent = s; box.appendChild(h);
    const st = document.createElement('div'); st.className = 'strip';
    fs.forEach(f => { const i = document.createElement('i'); i.style.background = SPLIT[f.split]?.[0] ?? '#888';
      i.title = `${f.frame}  ${SPLIT[f.split]?.[1] ?? f.split}${f.steps.length ? '  (steps saved)' : ''}`;
      if (f.steps.length) i.classList.add('saved'); if (f.frame === frame) i.classList.add('cur');
      i.onclick = () => go(f.frame); st.appendChild(i); });
    box.appendChild(st);
  });
  $('splitlegend').innerHTML = Object.entries(SPLIT).filter(([k]) => frames.some(f => f.split === k))
    .map(([k, [c, n]]) => `<span><span class="sw" style="background:${c}"></span> ${n}</span>`).join('') + '<span>• = steps saved</span>';
  $('curframe').textContent = frame ? `${frame}` : '';
}
function go(f) { frame = f; selT = -1; ckptBox(); strips(); load(); }
$('prev').onclick = () => { const i = frames.findIndex(f => f.frame === frame); if (i > 0) go(frames[i - 1].frame); };
$('next').onclick = () => { const i = frames.findIndex(f => f.frame === frame); if (i < frames.length - 1) go(frames[i + 1].frame); };

let curveData = {};
function drawCurves() {
  const m = $('cmetric').value, W = 340, H = 150, L = 34, B = 18;
  const series = ['train', 'views', 'scenes'].map(s => [s, curveData[`${s}_${m}`] || []]).filter(([, v]) => v.length);
  if (!series.length) { $('curves').innerHTML = '<small>no evaluations yet</small>'; return; }
  const all = series.flatMap(([, v]) => v), xs = all.map(p => p[0]), ys = all.map(p => p[1]).filter(y => y !== null);
  const x0 = 0, x1 = Math.max(...xs), y0 = Math.min(0, ...ys), y1 = Math.max(...ys) * 1.05 || 1;
  const X = x => L + (W - L - 6) * (x - x0) / (x1 - x0 || 1), Y = y => (H - B) - (H - B - 6) * (y - y0) / (y1 - y0 || 1);
  let svg = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">`;
  [y0, (y0 + y1) / 2, y1].forEach(t => svg += `<line x1="${L}" x2="${W - 6}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--line)"/><text x="2" y="${Y(t) + 3}">${t.toFixed(2)}</text>`);
  svg += `<text x="${L}" y="${H - 4}">0</text><text x="${W - 40}" y="${H - 4}">${x1}</text>`;
  series.forEach(([s, v]) => {
    const pts = v.filter(p => p[1] !== null).map(p => `${X(p[0]).toFixed(1)},${Y(p[1]).toFixed(1)}`).join(' ');
    svg += `<polyline fill="none" stroke="${CURVE[s]}" stroke-width="1.6" points="${pts}"/>`;
    const last = v[v.length - 1]; svg += `<text x="${X(last[0]) - 30}" y="${Y(last[1]) - 4}" style="fill:${CURVE[s]}">${last[1]?.toFixed(3)}</text>`;
  });
  if (run.best && m === 'pair_iou_fr') svg += `<line x1="${X(run.best.step)}" x2="${X(run.best.step)}" y1="6" y2="${H - B}" stroke="var(--muted)" stroke-dasharray="3 3"/>`;
  svg += '</svg>';
  $('curves').innerHTML = svg + '<div class="legend-row">' + series.map(([s]) => `<span style="color:${CURVE[s]}">— ${s === 'views' ? 'held-out views' : s === 'scenes' ? 'held-out scenes' : 'training frames'}</span>`).join('')
    + (run.best ? '<span>┊ best (views)</span>' : '') + '</div>';
}
$('cmetric').onchange = drawCurves;

(() => {  // resizable image strip: drag the bar above it (height remembered per browser)
  const root = document.documentElement;
  try { const h = localStorage.getItem('genviewer.imgh'); if (h) root.style.setProperty('--imgh', h); } catch (e) {}
  let y0 = 0, h0 = 0;
  const move = e => { const h = Math.max(60, Math.min(window.innerHeight * 0.75, h0 + (y0 - e.clientY))) + 'px'; root.style.setProperty('--imgh', h); };
  const up = () => { window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up);
    try { localStorage.setItem('genviewer.imgh', getComputedStyle(root).getPropertyValue('--imgh').trim()); } catch (e) {} };
  document.getElementById('split').addEventListener('pointerdown', e => { e.preventDefault(); y0 = e.clientY;
    h0 = parseFloat(getComputedStyle(root).getPropertyValue('--imgh')) || 200;
    window.addEventListener('pointermove', move); window.addEventListener('pointerup', up); });
})();

async function pick(r, el) {
  run = r; document.querySelectorAll('#runs .item').forEach(x => x.classList.remove('sel')); el.classList.add('sel');
  [frames, curveData] = await Promise.all([(await fetch('/api/frames?run=' + r.name)).json(), (await fetch('/api/curves?run=' + r.name)).json()]);
  drawCurves();
  if (!frames.some(f => f.frame === frame)) {  // default: the first held-out view, else the first training frame
    const f = frames.find(f => f.split === 'views' && f.steps.length) || frames.find(f => f.split === 'views') || frames.find(f => f.split === 'train');
    frame = f ? f.frame : null;
  }
  go(frame);
}
setInterval(async () => { if (run && !run.done) { curveData = await (await fetch('/api/curves?run=' + run.name)).json(); drawCurves(); } }, 30000);
(async () => {
  runs = await (await fetch('/api/runs')).json();
  const re = $('runs');
  if (!runs.length) { re.textContent = 'no runs yet'; return; }
  const item = r => { const d = document.createElement('div'); d.className = 'item';
    const v = r.final?.views?.pair_iou_fr;
    d.innerHTML = `<span>${r.name}</span><small>${r.n_train_ids} fr · ${r.done ? (v != null ? 'views IoU ' + v.toFixed(3) : 'done') : 'running'}</small>`;
    d.onclick = () => pick(r, d); return d; };
  const groups = new Map();
  runs.forEach(r => { const g = r.args.group || 'ungrouped'; if (!groups.has(g)) groups.set(g, []); groups.get(g).push(r); });
  let openG = {}; try { openG = JSON.parse(localStorage.getItem('genviewer.open') || '{}'); } catch (e) {}
  let firstEl = null;
  [...groups.entries()].forEach(([g, rs], gi) => {
    const det = document.createElement('details'); det.className = 'grp'; det.open = g in openG ? openG[g] : gi === 0;
    det.innerHTML = `<summary><span>${g}</span><small>${rs.length}</small></summary>`;
    det.addEventListener('toggle', () => { openG[g] = det.open; try { localStorage.setItem('genviewer.open', JSON.stringify(openG)); } catch (e) {} });
    rs.forEach(r => { const el = item(r); firstEl = firstEl || el; det.appendChild(el); }); re.appendChild(det);
  });
  pick(runs[0], firstEl);
})();
</script>
</body>
