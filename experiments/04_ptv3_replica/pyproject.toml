[project]
name = "ptv3-replica"
version = "0.1.0"
description = "Experiment 04: PTv3 / Sonata encoder on Replica (separate env because of spconv)"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "spconv-cu126>=2.3.8",
    "timm",
    "addict",
    "huggingface-hub",
    "scipy",
    "numpy",
    "fastapi",
    "uvicorn",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
