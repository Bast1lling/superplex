<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PTv3 Feature Viewer</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg: #15171c; --panel: rgba(30, 33, 40, 0.92); --fg: #e4e6eb; --muted: #9aa0ab; --line: #3a3f4b; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 13px/1.4 system-ui, sans-serif; overflow: hidden; }
  #panel { position: absolute; top: 12px; left: 12px; width: 260px; padding: 12px 14px; background: var(--panel); border-radius: 8px; box-shadow: 0 2px 12px rgba(0,0,0,.4); }
  #panel h1 { font-size: 14px; margin: 0 0 8px; }
  label { display: block; margin: 8px 0 3px; color: var(--muted); }
  select, input[type=range] { width: 100%; box-sizing: border-box; }
  select { background: #262a33; color: var(--fg); border: 1px solid var(--line); border-radius: 4px; padding: 4px 6px; font: inherit; }
  .row { display: flex; gap: 6px; align-items: center; }
  .row span { min-width: 48px; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
  #stats, #pick { margin-top: 10px; color: var(--muted); white-space: pre-line; font-variant-numeric: tabular-nums; }
  #pick:empty { display: none; }
  .note { margin-top: 8px; color: var(--muted); font-size: 12px; }
  #loading { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; font-size: 16px; color: var(--muted); pointer-events: none; }
</style>
<script type="importmap">
  { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  } }
</script>
</head>
<body>
<div id="panel">
  <h1>PTv3 features</h1>
  <label for="scene">Scene</label>
  <select id="scene"></select>
  <label for="model">Model</label>
  <select id="model"></select>
  <label for="stage">Stage</label>
  <select id="stage"></select>
  <label for="mode">Color by</label>
  <select id="mode">
    <option value="pca">feature PCA</option>
    <option value="token">token (pooling cell)</option>
    <option value="sim">similarity to picked point</option>
    <option value="instance">GT instance</option>
    <option value="rgb">RGB</option>
  </select>
  <label>Z range (m)</label>
  <div class="row"><input id="zmin" type="range" step="0.01"><span id="zminVal"></span></div>
  <div class="row"><input id="zmax" type="range" step="0.01"><span id="zmaxVal"></span></div>
  <label for="size">Point size (× 2 cm)</label>
  <div class="row"><input id="size" type="range" min="0.3" max="4" step="0.1" value="1.5"><span id="sizeVal">1.5</span></div>
  <div id="stats"></div>
  <div id="pick"></div>
  <div class="note">Double-click a point: orbit around it and show its feature similarity. Stage "full" = Sonata's concat of stages 2–4; token coloring uses stage 0 for "full".</div>
</div>
<div id="loading">encoding…</div>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const TOP_CUT = 0.3, GRID = 0.02;
const $ = (id) => document.getElementById(id);
const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setPixelRatio(devicePixelRatio);
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.LinearSRGBColorSpace; // colors are sRGB bytes already
renderer.localClippingEnabled = true;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x15171c);
const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.01, 1000);
camera.up.set(0, 0, 1);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.zoomToCursor = true;
controls.screenSpacePanning = true;

const clipLow = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0), clipHigh = new THREE.Plane(new THREE.Vector3(0, 0, -1), 0);
const material = new THREE.PointsMaterial({ vertexColors: true, sizeAttenuation: true, clippingPlanes: [clipLow, clipHigh] });
const marker = new THREE.Mesh(new THREE.SphereGeometry(0.04, 16, 12), new THREE.MeshBasicMaterial({ color: 0xffffff }));
marker.visible = false;
scene.add(marker);
let meta = null, data = null, points = null, bounds = null, picked = null, sim = null, token = 0;

// ---------- colors ----------
function turbo(t) {
  const r = 0.13572138 + t * (4.61539260 + t * (-42.66032258 + t * (132.13108234 + t * (-152.94239396 + t * 59.28637943))));
  const g = 0.09140261 + t * (2.19418839 + t * (4.84296658 + t * (-14.18503333 + t * (4.27729857 + t * 2.82956604))));
  const b = 0.10667330 + t * (12.64194608 + t * (-60.58204836 + t * (110.36276771 + t * (-89.90310912 + t * 27.34824973))));
  return [r, g, b].map((x) => Math.round(255 * Math.min(1, Math.max(0, x))));
}
const turboLut = (() => { const l = new Uint8Array(256 * 3); for (let i = 0; i < 256; i++) l.set(turbo(i / 255), 3 * i); return l; })();
function hashColor(id, out, o) { // stable pseudo-random bright color per integer id
  let h = Math.imul(id + 1, 2654435761) >>> 0;
  h ^= h >>> 15; h = Math.imul(h, 2246822519) >>> 0; h ^= h >>> 13;
  out[o] = 60 + (h & 0xff) * 0.75; out[o + 1] = 60 + ((h >>> 8) & 0xff) * 0.75; out[o + 2] = 60 + ((h >>> 16) & 0xff) * 0.75;
}

function colors() {
  const mode = $("mode").value, n = data.n, stage = $("stage").value;
  if (mode === "rgb") return data.rgb;
  if (mode === "pca") return data.pca[stage];
  const out = new Uint8Array(3 * n);
  if (mode === "token" || mode === "instance") {
    const ids = mode === "instance" ? data.inst : data.assign[stage === "full" ? 0 : parseInt(stage)];
    for (let i = 0; i < n; i++) hashColor(ids[i], out, 3 * i);
  } else if (mode === "sim") {
    if (!sim) { out.fill(90); return out; }
    // contrast: map [p50, max] of the similarity to the colormap
    const sorted = Uint8Array.from(sim).sort(), lo = sorted[Math.floor(0.5 * n)], hi = sorted[n - 1];
    for (let i = 0; i < n; i++) {
      const t = Math.max(0, Math.min(255, Math.round(255 * (sim[i] - lo) / Math.max(1, hi - lo))));
      out[3 * i] = turboLut[3 * t]; out[3 * i + 1] = turboLut[3 * t + 1]; out[3 * i + 2] = turboLut[3 * t + 2];
    }
  }
  return out;
}
function applyColors() {
  if (points) points.geometry.setAttribute("color", new THREE.BufferAttribute(colors(), 3, true));
}

// ---------- loading ----------
async function load() {
  const my = ++token;
  $("loading").style.display = "flex";
  $("pick").textContent = "";
  picked = null; sim = null; marker.visible = false;
  const t0 = performance.now();
  const res = await fetch(`/api/scene?scene=${$("scene").value}&model=${$("model").value}`);
  const buf = await res.arrayBuffer();
  if (my !== token) return;
  const n = parseInt(res.headers.get("X-Count"));
  const lo = res.headers.get("X-Min").split(",").map(Number), ext = res.headers.get("X-Extent").split(",").map(Number);
  const tokens = res.headers.get("X-Tokens").split(",").map(Number);
  const stages = meta.stages;
  data = { n, pos: new Uint16Array(buf, 0, 3 * n), inst: new Uint16Array(buf, 6 * n, n),
           assign: [0, 1, 2, 3, 4].map((s) => new Int32Array(buf, 8 * n + 4 * n * s, n)),
           rgb: new Uint8Array(buf, 28 * n, 3 * n), pca: {} };
  stages.forEach((s, k) => { data.pca[s] = new Uint8Array(buf, 31 * n + 3 * n * k, 3 * n); });

  const geom = new THREE.BufferGeometry();
  geom.setAttribute("position", new THREE.BufferAttribute(data.pos, 3, true));
  const sceneChanged = !bounds || $("scene").dataset.loaded !== $("scene").value;
  if (points) { scene.remove(points); points.geometry.dispose(); }
  points = new THREE.Points(geom, material);
  points.position.set(...lo);
  points.scale.set(...ext);
  points.frustumCulled = false;
  scene.add(points);
  bounds = new THREE.Box3(new THREE.Vector3(...lo), new THREE.Vector3(lo[0] + ext[0], lo[1] + ext[1], lo[2] + ext[2]));
  applyColors();
  if (sceneChanged) { resetZ(); fitCamera(); }
  $("scene").dataset.loaded = $("scene").value;
  setPointSize();
  $("loading").style.display = "none";
  $("stats").textContent = `${n.toLocaleString()} points (2 cm) · ${((performance.now() - t0) / 1000).toFixed(1)} s\n` +
    `tokens per stage: ${tokens.map((t) => t.toLocaleString()).join(" / ")}`;
}

function fitCamera() {
  const c = bounds.getCenter(new THREE.Vector3()), r = bounds.getSize(new THREE.Vector3()).length() / 2;
  controls.target.copy(c);
  camera.position.copy(c).add(new THREE.Vector3(0.6, -1.0, 0.9).normalize().multiplyScalar(r * 1.6));
  controls.update();
}
function setPointSize() {
  const k = parseFloat($("size").value);
  $("sizeVal").textContent = k.toFixed(1);
  material.size = GRID * k;
}
function applyZ(changed) {
  let lo = parseFloat($("zmin").value), hi = parseFloat($("zmax").value);
  if (lo > hi) { if (changed === "zmin") $("zmax").value = hi = lo; else $("zmin").value = lo = hi; }
  clipLow.constant = -lo; clipHigh.constant = hi;
  $("zminVal").textContent = lo.toFixed(2); $("zmaxVal").textContent = hi.toFixed(2);
}
function resetZ() {
  for (const id of ["zmin", "zmax"]) { $(id).min = bounds.min.z.toFixed(2); $(id).max = bounds.max.z.toFixed(2); }
  $("zmin").value = bounds.min.z.toFixed(2);
  $("zmax").value = (bounds.max.z - TOP_CUT).toFixed(2);
  applyZ();
}

// ---------- picking ----------
async function updateSimilarity() {
  if (picked === null) return;
  const res = await fetch("/api/similarity", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ scene: $("scene").value, model: $("model").value, stage: $("stage").value, index: picked }) });
  sim = new Uint8Array(await res.arrayBuffer());
  if ($("mode").value === "sim") applyColors();
}
const raycaster = new THREE.Raycaster();
renderer.domElement.addEventListener("dblclick", (e) => {
  if (!points) return;
  raycaster.setFromCamera(new THREE.Vector2((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1), camera);
  raycaster.params.Points.threshold = GRID * 2;
  const zlo = parseFloat($("zmin").value), zhi = parseFloat($("zmax").value);
  const hit = raycaster.intersectObject(points).find((h) => h.point.z >= zlo && h.point.z <= zhi);
  if (!hit) return;
  picked = hit.index;
  marker.position.copy(hit.point); marker.visible = true;
  controls.target.copy(hit.point); controls.update();
  $("pick").textContent = `picked point ${picked}: instance ${data.inst[picked]}\n` +
    `token ids s0–s4: ${data.assign.map((a) => a[picked]).join(" / ")}`;
  $("mode").value = "sim";
  updateSimilarity();
});

// ---------- loop & wiring ----------
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
addEventListener("resize", () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
$("scene").addEventListener("change", load);
$("model").addEventListener("change", load);
$("stage").addEventListener("change", () => { applyColors(); updateSimilarity(); });
$("mode").addEventListener("change", applyColors);
$("size").addEventListener("input", setPointSize);
$("zmin").addEventListener("input", () => applyZ("zmin"));
$("zmax").addEventListener("input", () => applyZ("zmax"));

meta = await (await fetch("/api/meta")).json();
for (const s of meta.scenes) $("scene").add(new Option(s, s));
for (const m of meta.models) $("model").add(new Option(m, m));
for (const s of meta.stages) $("stage").add(new Option(s === "full" ? "full (concat 2–4)" : `stage ${s}${s === "4" ? " (coarsest)" : ""}`, s));
$("scene").value = "room_0";
load();
</script>
</body>
</html>
