[project]
name = "superplex"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2",
    "pyyaml>=6.0.3",
    "scikit-image>=0.26.0",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "trackio>=0.42.0",
    "uvicorn>=0.54.0",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu130" }]
torchvision = [{ index = "pytorch-cu130" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
