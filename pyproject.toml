[project]
name = "superplex"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.15.0",
    "coacd>=1.0.14",
    "fastapi>=0.142.2",
    "matplotlib>=3.11.2",
    "omegaconf>=2.4.0",
    "plyfile>=1.1.5",
    "pyyaml>=6.0.3",
    "scikit-image>=0.26.0",
    "scikit-learn>=1.9.1",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "trackio>=0.42.0",
    "transformers>=5.21.0",
    "trimesh>=5.2.0",
    "uvicorn>=0.54.0",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu130" }]
torchvision = [{ index = "pytorch-cu130" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
